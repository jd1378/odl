[package]
name = "odl"
version = "3.0.0"
edition = "2024"
# let-chains are used throughout, which is what sets the floor.
rust-version = "1.89"
description = "flexible download library and CLI intended to be fast, reliable, and easy to use."
repository = "https://github.com/jd1378/odl"
homepage = "https://github.com/jd1378/odl"
license = "MIT"
authors = ["jd1378 <javad.mnjd@hotmail.com>"]
categories = ["command-line-utilities", "network-programming"]
keywords = ["download", "manager", "idm", "dl", "download-manager"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["http2", "gzip", "brotli", "rustls", "socks", "stream"] }
reqwest-retry = "0.9"
# `Url` and `HeaderMap` appear in odl's own public API. Depending on the crates
# that define them, rather than on reqwest's re-exports, is what lets a
# consumer match versions with odl without knowing which HTTP client it uses.
url = "2.5"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util = { version = "0.7", default-features = false }
thiserror = "2.0.12"
chrono = "0.4.41"
secrecy = "0.10.3"
once_cell = "1"
regex = "1"
filetime = "0.2"
prost = "0.14"
clap = { version = "4.5.41", features = ["derive"], optional = true }
dirs = "6.0.0"
derive_builder = "0.20.2"
ulid = "3"
futures = "0.3.31"
tempfile = "3.20.0"
bytes = "1"
atomicwrites = "0.4.4"
digest = "0.11"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
base64 = "0.22.1"
rand = "0.10"
tracing = "0.1.41"
async-trait = "0.1.88"
percent-encoding = "2.3.1"
mime_guess = "2"
indicatif = { version = "0.18.3", optional = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
toml = "1"
indexmap = { version = "2", features = ["serde"] }
humantime = "2"
reflink-copy = { version = "0.1.29", features = ["tracing"] }
deunicode = "1.6.2"

[target.'cfg(windows)'.dependencies]
# Job Objects are the only reliable way to tear down a spawned yt-dlp together
# with the grandchildren it spawns (ffmpeg). Bindings-only crate: the code it
# calls lives in the OS, so the binary-size cost is negligible.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"], optional = true }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["http2", "gzip", "brotli", "rustls", "socks", "stream", "blocking"] }
mockito = "1.7.0"
libc = "0.2.189"
async-trait = "0.1.88"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
prost-build = "0.14"
# Compiles the schema in-process. Building odl needs no `protoc` on the
# machine, so cross builds and minimal containers work with no extra step.
#
# Pinned exactly rather than by range: this crate is young, it runs on the
# build machine, and its output is the wire format everything on disk is
# written in. A new release should be read and its generated code diffed
# against the current one before it builds anything here.
protox = "=0.9.1"

[features]
default = ["cli", "ytdlp"]
# `tokio/signal` powers the interrupt handler: engines that drive a helper
# process isolate it in its own process group, so a terminal's Ctrl-C never
# reaches it and odl has to do the teardown itself.
cli = ["dep:clap", "dep:indicatif", "dep:tracing-subscriber", "dep:serde_json", "tokio/signal", "self-update"]
# Delegate downloads of known media hosts to an externally installed `yt-dlp`.
# Adds no crate dependencies of its own beyond JSON parsing and process control;
# `yt-dlp` itself is discovered at runtime and is never bundled.
ytdlp = ["dep:serde_json", "dep:windows-sys", "tokio/process", "tokio/io-util"]
# Replace odl's own binary with the latest GitHub release (`odl update`).
# Needs JSON to read the release listing and a process spawn to unpack the
# archive; the binary it replaces is only ever one odl's installer put there.
self-update = ["dep:serde_json", "tokio/process"]

[[bin]]
name = "odl"
path = "src/main.rs"
required-features = ["cli"]
